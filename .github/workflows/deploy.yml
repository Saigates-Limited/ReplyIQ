# Deploy ReplyIQ to Cloudflare Workers whenever main changes (or on demand from the Actions tab).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare "Edit Cloudflare Workers" token).
# Optional: CLOUDFLARE_ACCOUNT_ID, only if the token can see more than one Cloudflare account.
# Database migrations are NOT run here: apply any new db/migrations/*.sql in Supabase before merging.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Release gate (Amazon SP-API security review): no deploy while a production dependency has a high/critical vulnerability.
      - name: Vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
